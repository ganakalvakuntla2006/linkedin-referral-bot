name: LinkedIn 24/7 Auto-Referral Bot

on:
  schedule:
    - cron: '*/5 * * * *'  # Runs every 5 minutes 24/7
  workflow_dispatch:

jobs:
  referral-bot-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies & Playwright
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Execute LinkedIn Referral Scan
        env:
          LINKEDIN_LI_AT_COOKIE: ${{ secrets.LINKEDIN_LI_AT_COOKIE }}
          POLL_INTERVAL_MINUTES: 5
          DAILY_MESSAGE_LIMIT: 15
          SAFETY_DELAY_MIN_SEC: 30
          SAFETY_DELAY_MAX_SEC: 60
          TARGET_KEYWORDS: "Software Engineer, SDE, Frontend, Backend, Full Stack, DevOps, Data Engineer, Tech Lead, Engineering Manager, engineering, software, developer, mts, cse"
          MESSAGE_TEMPLATE: "Hi {firstName}, I’m Gana, a fourth-year student at IIITL. I recently completed my internship at Google.\n\nI wanted to ask if you could refer me internally at {company} for any suitable Software Engineering opportunities. I’d really appreciate your help. Thank you!"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: npm run scan
